name: Build Android APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Set version (increases every build so updates install over the old app)
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleRelease
      - name: Sign with permanent key
        env: { KS_PASS: "${{ secrets.KEYSTORE_PASSWORD }}" }
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks signing/release.keystore --ks-key-alias familytree \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out Our-family-tree-v${{ github.run_number }}.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: family-tree-apk-v${{ github.run_number }}
          path: Our-family-tree-v${{ github.run_number }}.apk
